<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12V0Z" fill="#64748B"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .panel-title { font: 700 20px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .panel-copy { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #334155; }
      .small-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
      .small-copy { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #475569; }
      .label { font: 700 16px 'Segoe UI', Arial, sans-serif; fill: #1E293B; }
      .chip { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #0F172A; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>

  <text x="60" y="70" class="title">C2C Cleaner Matching Platform</text>
  <text x="60" y="102" class="subtitle">A single platform for cleaner discovery, listing management, booking history, analytics, and administration.</text>

  <rect x="50" y="145" width="250" height="118" rx="22" fill="url(#panel)" stroke="#CBD5E1" filter="url(#shadow)"/>
  <rect x="50" y="145" width="10" height="118" rx="10" fill="#10B981"/>
  <text x="78" y="182" class="small-title">Homeowner</text>
  <text x="78" y="210" class="small-copy">Browse active cleaners</text>
  <text x="78" y="233" class="small-copy">Shortlist preferred providers</text>
  <text x="78" y="256" class="small-copy">Review confirmed service history</text>

  <rect x="50" y="285" width="250" height="118" rx="22" fill="url(#panel)" stroke="#CBD5E1" filter="url(#shadow)"/>
  <rect x="50" y="285" width="10" height="118" rx="10" fill="#3B82F6"/>
  <text x="78" y="322" class="small-title">Cleaner</text>
  <text x="78" y="350" class="small-copy">Create and edit service listings</text>
  <text x="78" y="373" class="small-copy">Track confirmed matches</text>
  <text x="78" y="396" class="small-copy">Monitor views and shortlists</text>

  <rect x="50" y="425" width="250" height="118" rx="22" fill="url(#panel)" stroke="#CBD5E1" filter="url(#shadow)"/>
  <rect x="50" y="425" width="10" height="118" rx="10" fill="#F59E0B"/>
  <text x="78" y="462" class="small-title">User Admin</text>
  <text x="78" y="490" class="small-copy">Create and manage users</text>
  <text x="78" y="513" class="small-copy">Maintain role-based profiles</text>
  <text x="78" y="536" class="small-copy">Suspend or reactivate accounts</text>

  <rect x="50" y="565" width="250" height="118" rx="22" fill="url(#panel)" stroke="#CBD5E1" filter="url(#shadow)"/>
  <rect x="50" y="565" width="10" height="118" rx="10" fill="#8B5CF6"/>
  <text x="78" y="602" class="small-title">Platform Management</text>
  <text x="78" y="630" class="small-copy">Manage service categories</text>
  <text x="78" y="653" class="small-copy">Generate daily, weekly, and monthly reports</text>
  <text x="78" y="676" class="small-copy">Review marketplace activity</text>

  <rect x="392" y="220" width="360" height="260" rx="28" fill="url(#panel)" stroke="#BFDBFE" filter="url(#shadow)"/>
  <text x="430" y="270" class="panel-title">React Frontend</text>
  <text x="430" y="304" class="panel-copy">Role-aware login and dashboard routing</text>
  <text x="430" y="332" class="panel-copy">Boundary components for each user experience</text>
  <text x="430" y="360" class="panel-copy">Shortlist, booking, listing, and reporting UI flows</text>
  <text x="430" y="388" class="panel-copy">Local session persistence for signed-in users</text>

  <rect x="430" y="420" width="110" height="34" rx="17" fill="#DCFCE7"/>
  <text x="456" y="442" class="chip">React 19</text>
  <rect x="552" y="420" width="130" height="34" rx="17" fill="#DBEAFE"/>
  <text x="577" y="442" class="chip">CSS + Fetch</text>

  <rect x="820" y="185" width="310" height="220" rx="28" fill="url(#panel)" stroke="#C7D2FE" filter="url(#shadow)"/>
  <text x="855" y="235" class="panel-title">Express Backend</text>
  <text x="855" y="269" class="panel-copy">Routes and controllers expose role-based APIs</text>
  <text x="855" y="297" class="panel-copy">Entity classes hold business logic and validation</text>
  <text x="855" y="325" class="panel-copy">Reporting aggregates logins, registrations, bookings,</text>
  <text x="855" y="348" class="panel-copy">listing trends, and monthly revenue data</text>

  <rect x="855" y="360" width="104" height="34" rx="17" fill="#E0E7FF"/>
  <text x="887" y="382" class="chip">Express 5</text>
  <rect x="970" y="360" width="84" height="34" rx="17" fill="#FDE68A"/>
  <text x="998" y="382" class="chip">Jest</text>

  <rect x="820" y="450" width="310" height="170" rx="28" fill="url(#panel)" stroke="#CBD5E1" filter="url(#shadow)"/>
  <text x="855" y="500" class="panel-title">PostgreSQL + Prisma</text>
  <text x="855" y="534" class="panel-copy">Persistent models for users, profiles, listings,</text>
  <text x="855" y="557" class="panel-copy">service categories, shortlists, matches, and login logs</text>
  <text x="855" y="585" class="panel-copy">Unique constraints and indexes support reliability</text>

  <rect x="855" y="586" width="90" height="34" rx="17" fill="#DCFCE7"/>
  <text x="881" y="608" class="chip">Prisma</text>
  <rect x="958" y="586" width="120" height="34" rx="17" fill="#E2E8F0"/>
  <text x="982" y="608" class="chip">PostgreSQL</text>

  <path d="M300 204H372" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M300 344H372" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M300 484H372" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M300 624H372" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M752 350H800" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M975 405V430" stroke="#64748B" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="392" y="545" width="360" height="110" rx="24" fill="url(#panel)" stroke="#CBD5E1" filter="url(#shadow)"/>
  <text x="430" y="590" class="label">Business outcomes</text>
  <text x="430" y="619" class="small-copy">Faster service discovery, better cleaner visibility, auditability, and operational reporting in one workflow.</text>
</svg>
